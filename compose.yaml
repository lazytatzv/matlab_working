services:
  matlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: matlab-custom:r2025a

    command: -browser
    shm_size: 4G

    volumes:
      - ./matlab_home/Documents/MATLAB:/home/matlab/Documents/MATLAB
      - matlab_pref:/home/matlab/.matlab
      - mathworks_data:/home/matlab/.MathWorks
    ports:
      - "8888:8888"

    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  matlab_pref:
  mathworks_data:
